# infra/cloudrun.service.yaml
# docs: 11-deployment-guide.md#deploy-api-first · 03-tech-stack.md#storage-infra
# Declarative Cloud Run service. Apply with:
#   gcloud run services replace infra/cloudrun.service.yaml --region "${REGION}"
# (envsubst ${PROJECT_ID}/${REGION}/${IMAGE} first, or set them in CI).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mirror-realm-api
  labels:
    app: mirror-realm
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: mirror-realm-runtime@${PROJECT_ID}.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: ${IMAGE}
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: MR_GCP_PROJECT
              value: ${PROJECT_ID}
            - name: MR_GCP_LOCATION
              value: ${REGION}
            - name: MR_GEMINI_MODEL
              value: gemini-3.1-flash-lite
            - name: MR_CORS_ORIGINS
              value: https://${PROJECT_ID}.web.app
            - name: MR_SCHEDULER_SA_EMAIL
              value: mirror-realm-scheduler@${PROJECT_ID}.iam.gserviceaccount.com
            - name: MR_ROTATE_AUDIENCE
              value: ${API_URL}
