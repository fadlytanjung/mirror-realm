# apps/api/pyproject.toml
# docs: 03-tech-stack.md#backend
[project]
name = "mirror-realm-api"
version = "1.0.0"
description = "Mirror Realm backend — FastAPI + google-genai (photo -> Level JSON)."
requires-python = ">=3.12,<3.13"
# Framework deps use compatible floors rather than exact pins; the lockfile
# (uv.lock) is the exact-version record. See docs/03 §pinning note.
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "google-genai>=1.0.0",
    "google-cloud-firestore>=2.19.0",
    "httpx>=0.27.2",
    "orjson>=3.10.12",
    "structlog>=24.4.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
    "google-auth>=2.36.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
    "datamodel-code-generator>=0.26.3",
    "pip-audit>=2.7.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Keep the spec's explicit Generic[T]/TypeVar style (docs/05 §abstract) rather
# than PEP 695 type-parameter syntax.
ignore = ["UP046", "UP047"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.*", "opentelemetry.*"]
ignore_missing_imports = true
